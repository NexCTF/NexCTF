x-db-env: &db-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexctf}
  POSTGRES_USER: ${POSTGRES_USER:-nexctf}
  POSTGRES_DB: ${POSTGRES_DB:-nexctf}
  POSTGRES_SERVER: ${POSTGRES_SERVER:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-cache}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-nexctf}

x-s3-env: &s3-env
  S3_ACCESS_KEY: &s3-access-key ${S3_ACCESS_KEY:-admin}
  S3_SECRET_KEY: &s3-secret-key ${S3_SECRET_KEY:-admin}
  S3_BUCKET: &s3-bucket ${S3_BUCKET:-nexctf}
  S3_HOST: ${S3_HOST:-s3}
  S3_PORT: ${S3_PORT:-9000}
  S3_REGION: ${S3_REGION:-us-east-1}

x-app-env: &app-env
  WORKERS: ${WORKERS:-4}
  ENVIRONMENT: production

  # CHANGE THIS: python -c "import secrets; print(secrets.token_urlsafe(32))"
  SECRET_KEY: ${SECRET_KEY:-fcJkuDpgLBVQRsyMWnxm9XEFTwPuXlY1WLR2Zr5Pw4o}

  # Extra browser origins allowed to call the API, comma-separated.
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-}

  # Number of proxies in front of the app, used to pick the client IP out of
  # X-Forwarded-For for rate limits and the audit log. 1 is the bundled Caddy;
  # add one per extra hop.
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}

  # The only URL you need to set: the app is served at https://${DOMAIN} and
  # challenge files at https://s3.${DOMAIN} — both need a DNS record, and a
  # custom cert (CERTS_PATH below) must list both names or downloads break.
  DOMAIN: ${DOMAIN:-localhost

  # Derived from DOMAIN when left empty. Override only when the public URL is
  # not https://${DOMAIN} — e.g. the default 8443 port mapping below.
  FRONTEND_HOST: ${FRONTEND_HOST:-}
  BACKEND_HOST: ${BACKEND_HOST:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

  # Set to "true" to seed example challenges, teams and submissions on start.
  # The demo accounts have no password; the admin comes from DEFAULT_ADMIN_*.
  DEMO_DATA: ${DEMO_DATA:-}

  # Comma-separated uv specifiers installed at start, e.g.
  #   NEXCTF_PLUGINS=nexctf-sandbox==1.2.0,git+https://github.com/org/plug@v1.0
  NEXCTF_PLUGINS: ${NEXCTF_PLUGINS:-}

services:
  db:
    image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    command: ["postgres", "-c", "max_connections=350"]
    environment:
      <<: *db-env
    networks:
      - internal

  s3:
    image: ghcr.io/coollabsio/maxio:0.4.2@sha256:2e7fc2a32d66fb31c44ce366e8a289218d3c38fcbe25bd6fa575b4df7c0e0272
    restart: always
    volumes:
      - app-s3-data:/data
    environment:
      MAXIO_ACCESS_KEY: *s3-access-key
      MAXIO_SECRET_KEY: *s3-secret-key
      MAXIO_DEFAULT_BUCKETS: *s3-bucket
    networks:
      - internal

  cache:
    image: valkey/valkey:9.1.2-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    volumes:
      - app-redis-data:/data
    command: >
      sh -c "valkey-server
      $( [ -n '${REDIS_PASSWORD:-}' ] && echo '--requirepass ${REDIS_PASSWORD}' )"
    networks:
      - internal

  app:
    image: ghcr.io/nexctf/nexctf:0.9.1
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - caddy-data:/data
      # Plugin downloads are cached here, so a restart works without network
      - uv-cache:/home/nexctf/.cache/uv
      # Uncomment and set CERTS_PATH to use custom TLS certificates
      # (also holds the CA bundle for SSL_CERT_FILE, if you need one):
      # - ${CERTS_PATH:-/dev/null}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/info"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    depends_on:
      db:
        condition: service_healthy
        restart: true
      s3:
        condition: service_healthy
        restart: true
      cache:
        condition: service_healthy
        restart: true
    environment:
      <<: [*db-env, *redis-env, *s3-env, *app-env]
    networks:
      - internal

networks:
  internal:

volumes:
  app-db-data:
  app-s3-data:
  app-redis-data:
  caddy-data:
  uv-cache:
