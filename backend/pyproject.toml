[project]
name = "nexctf"
version = "0.8.0"
description = "Next generation of capture the flag platform"
authors = [
    { name = "NexCTF", email = "contact@nexctf.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "fastapi-multiauth[oauth]>=0.4.0",
    "fastapi-toolsets[all]>=5.1.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "aioboto3>=13.0.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "pyotp>=2.10.0",
    "regex>=2026.7.19",
    "aiosmtplib>=3.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nexctf"
module-root = ""

[dependency-groups]
dev = [
    "pydantic-to-typescript>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]


[tool.fastapi-toolsets]
custom_cli = "nexctf.cli:cli"
fixtures = "nexctf.fixtures:fixture_registry"
db_context = "nexctf.core.db:get_db_context"

[tool.ruff.lint]
extend-select = ["E402"]
ignore = ["RUF012"]

[tool.ty.src]
exclude = ["plugins_store/nexctf_sandbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
