name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    name: Ruff + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Task
        run: curl -sSfL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
      - run: uv sync --frozen
        working-directory: backend
      - run: task dev:backend:check

  backend-test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: nexctf
          POSTGRES_PASSWORD: nexctf
          POSTGRES_DB: nexctf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexctf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: ghcr.io/coollabsio/maxio:0.4.2@sha256:2e7fc2a32d66fb31c44ce366e8a289218d3c38fcbe25bd6fa575b4df7c0e0272
        env:
          MAXIO_ACCESS_KEY: admin
          MAXIO_SECRET_KEY: admin
          MAXIO_DEFAULT_BUCKETS: nexctf
        ports:
          - 9000:9000
      mail:
        image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NEXCTF_TEST_MODE: "1"
      POSTGRES_SERVER: localhost
      POSTGRES_USER: nexctf
      POSTGRES_PASSWORD: nexctf
      POSTGRES_DB: nexctf
      REDIS_HOST: localhost
      S3_HOST: localhost
      S3_PORT: "9000"
      S3_BUCKET: nexctf
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --frozen
      - run: uv run pytest -n auto

  frontend-check:
    name: TypeScript + Biome + i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Task
        run: curl -sSfL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: task dev:frontend:check

  frontend-test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
